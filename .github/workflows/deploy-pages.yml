name: Deploy TradeBrain Pages

on:
  push:
    branches: [main]
    paths:
      - "providers/chatgpt/snapshots/**/*.json"
      - "providers/*/signal.json"
      - "prompts/**"
      - "index.html"
      - "assets/**"
      - "config/**"
      - "schemas/**"
      - "scripts/**"
      - "test/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tradebrain-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize pending ChatGPT snapshots
        run: node scripts/finalize-chatgpt.mjs
      - name: Commit finalized ChatGPT provider state
        shell: bash
        run: |
          if ! git diff --quiet -- providers/chatgpt/history.json providers/chatgpt/status.json providers/chatgpt/signal.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add providers/chatgpt/history.json providers/chatgpt/status.json providers/chatgpt/signal.json
            git commit -m "data(chatgpt): finalize provider publication"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate provider repository state
        run: node scripts/validate-repository.mjs
      - name: Run tests
        run: node --test
      - name: Build static site
        run: node scripts/build-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
