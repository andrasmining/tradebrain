name: Deploy TradeBrain Pages

on:
  push:
    branches: [main]
    paths:
      - "providers/*/signal.json"
      - "prompts/**"
      - "index.html"
      - "assets/**"
      - "config/**"
      - "schemas/**"
      - "scripts/**"
      - "test/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tradebrain-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate provider repository state
        run: node scripts/validate-repository.mjs
      - name: Run tests
        run: node --test
      - name: Build static site
        run: node scripts/build-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
