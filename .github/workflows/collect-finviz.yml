name: Collect shared Finviz context

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradebrain-finviz-context
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout main without write credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-finviz.txt
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Finviz collector dependency
        run: python -m pip install --disable-pip-version-check -r requirements-finviz.txt
      - name: Collect shared context
        run: python scripts/collect_finviz.py
      - name: Validate collected context
        run: node scripts/validate-finviz-context.mjs data/finviz/latest.json
      - name: Stage data-only artifact
        shell: bash
        run: |
          mkdir -p finviz-artifact
          cp data/finviz/latest.json finviz-artifact/latest.json
      - name: Upload validated context
        uses: actions/upload-artifact@v7
        with:
          name: finviz-context
          path: finviz-artifact/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download validated context
        uses: actions/download-artifact@v8
        with:
          name: finviz-context
          path: finviz-artifact
      - name: Validate artifact and install owned output
        shell: bash
        run: |
          git pull --ff-only origin main
          node scripts/validate-finviz-context.mjs finviz-artifact/latest.json
          install -D -m 0644 finviz-artifact/latest.json data/finviz/latest.json
      - name: Commit and push Finviz-owned data
        shell: bash
        run: |
          if git diff --quiet -- data/finviz/latest.json; then
            echo "Finviz context is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/finviz/latest.json
          git commit -m "data(finviz): refresh shared market context"

          if ! git push origin HEAD:main; then
            echo "Push raced with another repository update; rebasing and retrying once."
            git pull --rebase origin main
            node scripts/validate-finviz-context.mjs data/finviz/latest.json
            git push origin HEAD:main
          fi
