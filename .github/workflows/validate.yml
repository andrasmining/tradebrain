name: Validate TradeBrain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate provider repository state
        run: node scripts/validate-repository.mjs
      - name: Run tests
        run: node --test
      - name: Build static site
        run: node scripts/build-site.mjs
