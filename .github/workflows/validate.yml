name: Validate TradeBrain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate provider repository state
        run: node scripts/validate-repository.mjs
      - name: Run tests
        run: node --test
      - name: Build static site
        run: node scripts/build-site.mjs
