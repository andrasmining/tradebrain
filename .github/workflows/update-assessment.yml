name: Update NQ Pause-Board Assessment

# Stündlich (cron) plus manuelles Triggern über die GitHub-Oberfläche.
on:
  schedule:
    # Jede volle Stunde (UTC). GitHub-Cron kann sich um einige Minuten verzögern.
    - cron: '0 * * * *'
  workflow_dispatch:

# Schreibrechte, damit der Workflow die aktualisierte status.json zurückcommitten kann.
permissions:
  contents: write

# Verhindert, dass sich überlappende Läufe gegenseitig ins Gehege kommen.
concurrency:
  group: update-assessment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assessment abrufen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: Modell über eine Repository-Variable überschreiben.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/fetch-assessment.mjs

      - name: Committen & pushen, falls geändert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/status.json)" ]]; then
            git add data/status.json
            git commit -m "chore: update assessment $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Keine Änderung an status.json — nichts zu committen."
          fi
